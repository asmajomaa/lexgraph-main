<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620" font-family="Segoe UI, system-ui, sans-serif">
<title>LEXGRAPH-RAG architecture</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6b7a"/>
</marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="30" font-size="16" font-weight="700" fill="#1b2430">LEXGRAPH-RAG: architecture</text>
<text x="24" y="48" font-size="11" fill="#5d6b7a">rule-based Reason -> Act -> Observe agent over three retrieval paths</text>
<rect x="24" y="70" width="250" height="96" rx="6" fill="#f6f8fa" stroke="#b9c3cd" stroke-width="1.2"/>
<text x="34" y="90" font-size="12.5" font-weight="600" fill="#1b2430">Clients</text>
<text x="34" y="107" font-size="10.5" fill="#5d6b7a">CLI  main.py</text>
<text x="34" y="121" font-size="10.5" fill="#5d6b7a">Workbench (HTML + JSON API)</text>
<rect x="24" y="190" width="250" height="120" rx="6" fill="#eef1ff" stroke="#b9b9ee" stroke-width="1.2"/>
<text x="34" y="210" font-size="12.5" font-weight="600" fill="#4b4acf">ReActAgent</text>
<text x="34" y="227" font-size="10.5" fill="#5d6b7a">reason(): keyword match</text>
<text x="34" y="241" font-size="10.5" fill="#5d6b7a">act(): dispatch</text>
<text x="34" y="255" font-size="10.5" fill="#5d6b7a">observe(): rows + stats</text>
<text x="34" y="269" font-size="10.5" fill="#5d6b7a">run(): result + logs</text>
<rect x="24" y="334" width="250" height="76" rx="6" fill="#f6f8fa" stroke="#b9c3cd" stroke-width="1.2"/>
<text x="34" y="354" font-size="12.5" font-weight="600" fill="#1b2430">Datasets (real)</text>
<text x="34" y="371" font-size="10.5" fill="#5d6b7a">20 Newsgroups: 18,719 docs</text>
<text x="34" y="385" font-size="10.5" fill="#5d6b7a">Legal Case Reports: 3,890</text>
<rect x="340" y="70" width="250" height="110" rx="6" fill="#e6f4f4" stroke="#9fc9c9" stroke-width="1.2"/>
<text x="350" y="90" font-size="12.5" font-weight="600" fill="#0f6b6b">Path 2: lexical baseline</text>
<text x="350" y="107" font-size="10.5" fill="#5d6b7a">tokenise query</text>
<text x="350" y="121" font-size="10.5" fill="#5d6b7a">BM25 over all postings</text>
<text x="350" y="135" font-size="10.5" fill="#5d6b7a">TopKHeap</text>
<rect x="340" y="200" width="250" height="130" rx="6" fill="#fbf0dc" stroke="#e0c58a" stroke-width="1.2"/>
<text x="350" y="220" font-size="12.5" font-weight="600" fill="#b7791f">Path 3: lexical, ML</text>
<text x="350" y="237" font-size="10.5" fill="#5d6b7a">vectorise query</text>
<text x="350" y="251" font-size="10.5" fill="#5d6b7a">predict_top_n -> clusters</text>
<text x="350" y="265" font-size="10.5" fill="#5d6b7a">ClusterFilter prune</text>
<text x="350" y="279" font-size="10.5" fill="#5d6b7a">BM25 over candidates</text>
<rect x="340" y="350" width="250" height="116" rx="6" fill="#ecebff" stroke="#b9b9ee" stroke-width="1.2"/>
<text x="350" y="370" font-size="12.5" font-weight="600" fill="#4b4acf">Path 1: relational</text>
<text x="350" y="387" font-size="10.5" fill="#5d6b7a">resolve case id</text>
<text x="350" y="401" font-size="10.5" fill="#5d6b7a">BFS(depth, direction)</text>
<text x="350" y="415" font-size="10.5" fill="#5d6b7a">typed edge filter</text>
<rect x="650" y="70" width="266" height="96" rx="6" fill="#ffffff" stroke="#b9c3cd" stroke-width="1.2"/>
<text x="660" y="90" font-size="12.5" font-weight="600" fill="#1b2430">InvertedIndex</text>
<text x="660" y="107" font-size="10.5" fill="#5d6b7a">HashSetTable postings</text>
<text x="660" y="121" font-size="10.5" fill="#5d6b7a">doc_lengths, avgdl, N</text>
<rect x="650" y="186" width="266" height="96" rx="6" fill="#ffffff" stroke="#b9c3cd" stroke-width="1.2"/>
<text x="660" y="206" font-size="12.5" font-weight="600" fill="#1b2430">BM25</text>
<text x="660" y="223" font-size="10.5" fill="#5d6b7a">k1=1.5, b=0.75</text>
<text x="660" y="237" font-size="10.5" fill="#5d6b7a">TopKHeap (log k)</text>
<rect x="650" y="302" width="266" height="82" rx="6" fill="#ffffff" stroke="#b9c3cd" stroke-width="1.2"/>
<text x="660" y="322" font-size="12.5" font-weight="600" fill="#1b2430">KMeans + Vectorizer</text>
<text x="660" y="339" font-size="10.5" fill="#5d6b7a">dense centroids</text>
<text x="660" y="353" font-size="10.5" fill="#5d6b7a">L2 sparse vectors</text>
<rect x="650" y="404" width="266" height="82" rx="6" fill="#ffffff" stroke="#b9c3cd" stroke-width="1.2"/>
<text x="660" y="424" font-size="12.5" font-weight="600" fill="#1b2430">CitationGraph</text>
<text x="660" y="441" font-size="10.5" fill="#5d6b7a">out + in adjacency</text>
<text x="660" y="455" font-size="10.5" fill="#5d6b7a">ring-buffer BFS</text>
<rect x="650" y="506" width="266" height="62" rx="6" fill="#f6f8fa" stroke="#b9c3cd" stroke-width="1.2"/>
<text x="660" y="526" font-size="12.5" font-weight="600" fill="#1b2430">Cache</text>
<text x="660" y="543" font-size="10.5" fill="#5d6b7a">cache/engine.pkl</text>
<line x1="149" y1="166" x2="149" y2="190" stroke="#5d6b7a" stroke-width="1.1" marker-end="url(#arrow)"/>
<text x="149" y="173" font-size="9.5" fill="#8a97a5" text-anchor="middle">uses</text>
<line x1="274" y1="210" x2="340" y2="120" stroke="#5d6b7a" stroke-width="1.1" marker-end="url(#arrow)"/>
<text x="307" y="160" font-size="9.5" fill="#8a97a5" text-anchor="middle">baseline</text>
<line x1="274" y1="248" x2="340" y2="262" stroke="#5d6b7a" stroke-width="1.1" marker-end="url(#arrow)"/>
<text x="307" y="250" font-size="9.5" fill="#8a97a5" text-anchor="middle">ml</text>
<line x1="274" y1="288" x2="340" y2="400" stroke="#5d6b7a" stroke-width="1.1" marker-end="url(#arrow)"/>
<text x="307" y="339" font-size="9.5" fill="#8a97a5" text-anchor="middle">relational</text>
<line x1="274" y1="360" x2="300" y2="360" stroke="#5d6b7a" stroke-width="1.1"/>
<line x1="300" y1="360" x2="300" y2="537" stroke="#5d6b7a" stroke-width="1.1"/>
<line x1="300" y1="537" x2="650" y2="537" stroke="#5d6b7a" stroke-width="1.1" marker-end="url(#arrow)"/>
<text x="312" y="430" font-size="9.5" fill="#8a97a5" text-anchor="middle">loads + builds</text>
<line x1="590" y1="125" x2="650" y2="118" stroke="#5d6b7a" stroke-width="1.1" marker-end="url(#arrow)"/>
<line x1="590" y1="265" x2="650" y2="234" stroke="#5d6b7a" stroke-width="1.1" marker-end="url(#arrow)"/>
<line x1="590" y1="340" x2="650" y2="343" stroke="#5d6b7a" stroke-width="1.1" marker-end="url(#arrow)"/>
<line x1="590" y1="408" x2="650" y2="445" stroke="#5d6b7a" stroke-width="1.1" marker-end="url(#arrow)"/>
<line x1="783" y1="166" x2="783" y2="186" stroke="#5d6b7a" stroke-width="1.1" marker-end="url(#arrow)"/>
<text x="24" y="590" font-size="10" fill="#8a97a5">Every structure and algorithm is pure Python; numpy/sklearn appear only in benchmarks and tests.</text>
</svg>